services:
  - type: web
    name: four-spin-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && cd config && python manage.py collectstatic --noinput
    # Single worker is required: Socket.IO state + SQLite writer live in one process.
    startCommand: cd config && python manage.py migrate --noinput && python -m uvicorn config.asgi:application --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SQLITE_PATH
        value: /var/data/db.sqlite3
